
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #000000;
        }

        body {
            font-family: Arial, sans-serif;
            color: #ffffff;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 350px;
            max-width: 90%;
            padding: 35px;
            background-color: #000000;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            color: #ffffff;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #444444;
            border-radius: 5px;
        }

        input::placeholder {
            color: #aaaaaa;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .message {
            margin-top: 20px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h1>Login</h1>

        <form method="POST" action="/">
            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p class="message">{{ message }}</p>
    </div>

</body>
</html>
